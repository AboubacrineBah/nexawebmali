<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#16213C">
    <title>Maintenance en cours | NexaWeb Mali</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #16213C;
            color: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        main {
            width: min(100%, 38rem);
            padding: clamp(2rem, 7vw, 4rem);
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 1rem;
            background: #1d2b4a;
            text-align: center;
        }

        .brand {
            margin: 0 0 2rem;
            color: #fff;
            font-family: Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .brand span {
            display: block;
            margin-top: .25rem;
            color: #C99A2E;
            font: 700 .7rem Arial, sans-serif;
            letter-spacing: .35em;
        }

        .status {
            display: inline-block;
            margin-bottom: 1rem;
            padding: .4rem .8rem;
            border-radius: 999px;
            background: rgb(62 142 99 / 20%);
            color: #a9e0be;
            font-size: .9rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 7vw, 3rem);
        }

        p {
            color: #d3d9e6;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .75rem;
            margin-top: 2rem;
        }

        .actions a {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: .7rem 1rem;
            border: 2px solid #3E8E63;
            border-radius: .5rem;
            background: #2F7350;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .actions a:hover,
        .actions a:focus-visible {
            background: #245c42;
        }

        .actions a:focus-visible {
            outline: 3px solid #C99A2E;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <p class="brand">NexaWeb<span>MALI</span></p>
        <span class="status">Intervention en cours</span>
        <h1>Le site revient bientôt.</h1>
        <p>Nous effectuons une maintenance pour améliorer votre expérience. Merci de votre patience.</p>
        <p>Pour toute demande urgente, vous pouvez nous contacter directement.</p>
        <div class="actions">
            <a
                href="https://wa.me/22382890992?text=Bonjour%20NexaWeb%20Mali%2C%20j%E2%80%99ai%20une%20demande%20pendant%20la%20maintenance%20du%20site.">Contacter
                sur WhatsApp</a>
            <a href="mailto:bahaboubacrine1@gmail.com">Envoyer un e-mail</a>
        </div>
    </main>
</body>

</html>
